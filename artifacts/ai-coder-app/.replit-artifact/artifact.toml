kind = "mobile"
previewPath = "/ai-coder-app/"
title = "AI Coder App"
description = "An Android-first local AI app builder inspired by Replit and December, with prompt-driven project creation, file browsing, code viewing, live preview, and locally stored BYOK model settings."
version = "1.0.0"
id = "artifacts/ai-coder-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/ai-coder-app/" ]
localPort = 19256

[services.development]
run = "pnpm --filter @workspace/ai-coder-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-coder-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ai-coder-app", "run", "serve" ]

[services.env]
PORT = "19256"
BASE_PATH = "/ai-coder-app/"
